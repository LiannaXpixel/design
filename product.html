        overflow: hidden;
        cursor: default;

        justify-content: center; /* Center content horizontally */
        align-items: center; /* Center content vertically */
        width: 100%;
        height: 700px;
        background-color: var(--border-color); /* Fallback background */

    /* Slim champagne satin strip — gallery dimensions and images unchanged */
    .card-gallery::after {
        content: "";

        left: 0;
        right: 0;
        bottom: 0;
        height: 7px;
        background: #151515;
        box-shadow: none;
        pointer-events: none;
        z-index: 5;

    .card-gallery-images {

    <script>
        const PAYPAL_CHECKOUT_URL = "https://plata-shopliannax.slleek-estetique.workers.dev";

        function openCheckout(productId) {
            const overlay = document.getElementById('checkoutOverlay');
            const frame = document.getElementById('checkoutFrame');
            overlay.style.display = 'flex';
            frame.src = PAYPAL_CHECKOUT_URL + "/?product=" + encodeURIComponent(productId);
            document.body.style.overflow = 'hidden';
        }

        function closeCheckout() {
            document.getElementById('checkoutOverlay').style.display = 'none';
            document.getElementById('checkoutFrame').src = ''; /* Clear src */
            document.body.style.overflow = 'auto';
        }

        function openImage(src, altText) {
            const popupImage = document.getElementById('popupImage');
            popupImage.src = src;
            popupImage.alt = altText;
            popupImage.classList.remove('loaded'); /* Reset for fade-in */
            document.getElementById('imagePopup').style.display = 'flex';
            document.body.style.overflow = 'hidden';

            popupImage.onload = () => {
                popupImage.classList.add('loaded');
            };
            if (popupImage.complete) {
                 popupImage.classList.add('loaded');
            }
        }

        function closeImage() {
            document.getElementById('imagePopup').style.display = 'none';
            document.getElementById('popupImage').src = ''; /* Clear src */
            document.getElementById('popupImage').alt = ''; /* Clear alt text */
            document.body.style.overflow = 'auto';
        }

        window.addEventListener('click', function (e) {
            const overlay = document.getElementById('checkoutOverlay');
            const imagePopup = document.getElementById('imagePopup');

            if (e.target === overlay) {
                closeCheckout();
            }

            if (e.target === imagePopup) {
                closeImage();
            }
        });

        /* Function to handle image switching and apply zoom listener */
        function updateGalleryImage(wrapperElement, imgElement) {
            const img = imgElement;
            img.style.opacity = '0'; /* Start hidden for fade effect */

            /* Set the onclick handler directly on the image */
            img.onclick = null;

            img.onload = () => {
                img.classList.add('loaded');
                img.style.opacity = '1'; /* Make visible after loaded */
            };
            if (img.complete) { /* For cached images */
                img.classList.add('loaded');
                img.style.opacity = '1';
            }
        }

        function changeImage(direction, galleryId) {
            const gallery = document.getElementById(galleryId);
            const imagesContainer = gallery.querySelector('.card-gallery-images');
            const imageWrappers = Array.from(imagesContainer.querySelectorAll('.card-gallery-image-wrapper'));

            let currentIndex = -1;
            for (let i = 0; i < imageWrappers.length; i++) {
                if (imageWrappers[i].style.display === 'block') {
                    currentIndex = i;
                    break;
                }
            }
            if (currentIndex === -1) currentIndex = 0; /* Default to first image if none active */

            let newIndex = currentIndex + direction;

            if (newIndex < 0) {
                newIndex = imageWrappers.length - 1;
            } else if (newIndex >= imageWrappers.length) {
                newIndex = 0;
            }

            imageWrappers.forEach((wrapper, index) => {
                if (index === newIndex) {
                    wrapper.style.display = 'block';
                    const img = wrapper.querySelector('img');
                    if (img) {
                        updateGalleryImage(wrapper, img); /* Apply updates and listener */
                    }
                } else {
                    wrapper.style.display = 'none';
                }
            });
        }

        /* Initialize the gallery display and set up onclick for first image */
        document.addEventListener('DOMContentLoaded', () => {
            const galleries = document.querySelectorAll('.card-gallery');
            galleries.forEach(gallery => {
                const imageWrappers = gallery.querySelectorAll('.card-gallery-image-wrapper');
                imageWrappers.forEach((wrapper, index) => {
                    if (index === 0) {
                        wrapper.style.display = 'block';
                        const img = wrapper.querySelector('img');
                        if (img) {
                            updateGalleryImage(wrapper, img); /* Initialize for the first image */
                        }
                    } else {
                        wrapper.style.display = 'none';
                    }
                });
            });

            /* Ensure popup image is handled */
            const popupImage = document.getElementById('popupImage');
            if (popupImage && popupImage.src) {
                popupImage.onload = () => {
                    popupImage.classList.add('loaded');
                };
                if (popupImage.complete) {
                    popupImage.classList.add('loaded');
                }
            }
        });
    </script>


<script>
(function () {
  "use strict";
  const WORKER_URL = "https://plata-shopliannax.slleek-estetique.workers.dev";
  function imageUrl(value) {
    const image = String(value || "");
    if (/^https?:\/\//i.test(image)) return image;
    if (image.startsWith("product-images/")) return WORKER_URL + "/asset?key=" + encodeURIComponent(image);
    return image;
  }

  function cleanSeoText(value) {
    return String(value || "")
      .replace(/https?:\/\/[^\s<]+/gi, " ")
      .replace(/[\r\n\t]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function makeSeoDescription(product) {
    const parts = [product.shortDescription, product.description, product.longDescription]
      .map(cleanSeoText)
      .filter(Boolean);
    const description = [...new Set(parts)].join(" ");
    if (description.length <= 160) {
      return description || "Explore this premium digital product from ShopLiannaX.";
    }
    let shortened = description.slice(0, 157);
    const lastSpace = shortened.lastIndexOf(" ");
    if (lastSpace > 115) shortened = shortened.slice(0, lastSpace);
    return shortened.replace(/[\s,;:.-]+$/, "") + "…";
  }

  function makeSeoTitle(name) {
    const suffix = " | ShopLiannaX";
    const maxNameLength = 60 - suffix.length;
    let shortName = cleanSeoText(name);
    if (shortName.length > maxNameLength) {
      shortName = shortName.slice(0, maxNameLength - 1);
      const lastSpace = shortName.lastIndexOf(" ");
      if (lastSpace > 20) shortName = shortName.slice(0, lastSpace);
      shortName = shortName.replace(/[\s,;:.-]+$/, "") + "…";
    }
    return shortName + suffix;
  }

  function makeProductHeading(name) {
    const heading = cleanSeoText(name);
    if (heading.length <= 55) return heading;
    let shortened = heading.slice(0, 54);
    const lastSpace = shortened.lastIndexOf(" ");
    if (lastSpace > 25) shortened = shortened.slice(0, lastSpace);
    return shortened.replace(/[\\s,;:.-]+$/, "") + "…";
  }

  function setMetaTag(attribute, key, value) {
    let tag = document.head.querySelector('meta[' + attribute + '="' + key + '"]');
    if (!tag) {
      tag = document.createElement("meta");
      tag.setAttribute(attribute, key);
      document.head.appendChild(tag);
    }
    tag.setAttribute("content", value);
  }

  function setCanonical(url) {
    let link = document.head.querySelector('link[rel="canonical"]');
    if (!link) {
      link = document.createElement("link");
      link.rel = "canonical";
      document.head.appendChild(link);
    }
    link.href = url;
  }

  function updateProductSeo(product) {
    const canonical = new URL("/product.html", "https://shopliannax.com");
    canonical.searchParams.set("id", product.id);
    const canonicalUrl = canonical.href;
    const seoTitle = makeSeoTitle(product.name);
    const seoDescription = makeSeoDescription(product);

    document.title = seoTitle;
    setMetaTag("name", "description", seoDescription);
    setMetaTag("name", "robots", "index,follow");
    setMetaTag("property", "og:type", "product");
    setMetaTag("property", "og:site_name", "ShopLiannaX");
    setMetaTag("property", "og:title", seoTitle);
    setMetaTag("property", "og:description", seoDescription);
    setMetaTag("property", "og:url", canonicalUrl);
    setMetaTag("name", "twitter:card", "summary_large_image");
    setMetaTag("name", "twitter:title", seoTitle);
    setMetaTag("name", "twitter:description", seoDescription);
    setCanonical(canonicalUrl);

    const schemaImages = (product.images || [])
      .filter(Boolean)
      .map(src => {
        try { return new URL(imageUrl(src), window.location.href).href; }
        catch (_) { return ""; }
      })
      .filter(Boolean);

    const schemaDescription = cleanSeoText(
      product.longDescription || product.description || product.shortDescription
    ) || seoDescription;

    const schema = {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": product.name,
      "description": schemaDescription,
      "sku": product.id,
      "image": schemaImages,
      "brand": {
        "@type": "Brand",
        "name": "ShopLiannaX"
      },
      "offers": {
        "@type": "Offer",
        "url": canonicalUrl,
        "priceCurrency": product.currency || "USD",
        "price": String(product.amount),
        "availability": "https://schema.org/InStock",
        "itemCondition": "https://schema.org/NewCondition"
      }
    };

    let schemaTag = document.getElementById("dynamic-product-schema");
    if (!schemaTag) {
      schemaTag = document.createElement("script");
      schemaTag.id = "dynamic-product-schema";
      schemaTag.type = "application/ld+json";
      document.head.appendChild(schemaTag);
    }
    schemaTag.textContent = JSON.stringify(schema);
  }

  async function loadProductDetail() {
    const id = new URLSearchParams(location.search).get("id");
    const root = document.getElementById("dynamicProductDetail");
    if (!id) {
      setMetaTag("name", "robots", "noindex,follow");
      root.textContent = "Product not found.";
      return;
    }
    try {
      const response = await fetch(WORKER_URL + "/catalog", { cache: "no-store" });
      if (!response.ok) throw new Error("Catalog unavailable.");
      const data = await response.json();
      const product = (data.products || []).find(item => item.id === id);
      if (!product) {
        setMetaTag("name", "robots", "noindex,follow");
        root.textContent = "Product not found.";
        return;
      }
      updateProductSeo(product);
      const card = document.createElement("div");
      card.className = "card";
      const gallery = document.createElement("div");
      gallery.className = "card-gallery";
      gallery.id = "dynamic-product-gallery";
      const images = document.createElement("div");
      images.className = "card-gallery-images";
      (product.images && product.images.length ? product.images : [""]).forEach((src, i) => {
        const wrap = document.createElement("div");
        wrap.className = "card-gallery-image-wrapper";
        wrap.style.display = i === 0 ? "block" : "none";
        if (!src) wrap.classList.add("placeholder-visible");
        const img = document.createElement("img");
        img.alt = product.name + " preview " + (i + 1);
        img.loading = i ? "lazy" : "eager";
        if (src) img.src = imageUrl(src);
        img.onerror = function(){ this.style.display="none"; wrap.classList.add("placeholder-visible"); };
        wrap.appendChild(img); images.appendChild(wrap);
      });
      gallery.appendChild(images);
      const nav = document.createElement("div"); nav.className = "card-gallery-nav";
      const prev = document.createElement("button"); prev.textContent = "←"; prev.type="button";
      prev.onclick = () => changeImage(-1, gallery.id);
      const next = document.createElement("button"); next.textContent = "→"; next.type="button";
      next.onclick = () => changeImage(1, gallery.id);
      nav.append(prev,next); gallery.appendChild(nav);
      card.appendChild(gallery);

      const content = document.createElement("div"); content.className = "card-content";
      const title = document.createElement("h1"); title.textContent = makeProductHeading(product.name);
      const price = document.createElement("div"); price.className = "price price-top"; price.textContent = "$" + product.amount;
      const buy = document.createElement("a"); buy.href="#"; buy.className="buy-btn buy-btn-top"; buy.textContent="BUY NOW";
      buy.onclick = function(e){ e.preventDefault(); openCheckout(product.id); };
      const shortSummaryText = String(product.shortDescription || "").trim();
      const longDetailsText = String(product.longDescription || product.description || "").trim();
      let summary = null;
      if (shortSummaryText && cleanSeoText(shortSummaryText) !== cleanSeoText(longDetailsText)) {
        summary = document.createElement("p");
        summary.className = "description product-summary";
        summary.textContent = shortSummaryText;
      }
      const description = document.createElement("div"); description.className="description";
      const descriptionText = longDetailsText;
      const urlPattern = /https?:\/\/[^\s<]+/g;
      let lastIndex = 0;
      for (const match of descriptionText.matchAll(urlPattern)) {
        const before = descriptionText.slice(lastIndex, match.index);
        if (before) description.appendChild(document.createTextNode(before));
        const rawUrl = match[0];
        const cleanUrl = rawUrl.replace(/[),.!?]+$/, "");
        const trailing = rawUrl.slice(cleanUrl.length);
        let parsedUrl;
        try { parsedUrl = new URL(cleanUrl); } catch (_) { parsedUrl = null; }
        if (parsedUrl && (parsedUrl.hostname === "youtube.com" || parsedUrl.hostname.endsWith(".youtube.com") || parsedUrl.hostname === "youtu.be")) {
          const link = document.createElement("a");
          link.href = parsedUrl.href;
          link.textContent = "Watch the free YouTube preview ↗";
          link.className = "youtube-demo-link";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.style.display = "inline-block";
          link.style.color = "#f0d9c2";
          link.style.textDecoration = "underline";
          link.style.fontWeight = "700";
          link.style.cursor = "pointer";
          description.appendChild(link);
        } else {
          description.appendChild(document.createTextNode(cleanUrl));
        }
        if (trailing) description.appendChild(document.createTextNode(trailing));
        lastIndex = match.index + rawUrl.length;
      }
      if (lastIndex < descriptionText.length) description.appendChild(document.createTextNode(descriptionText.slice(lastIndex)));
      content.append(title,price,buy); if (summary) content.appendChild(summary); content.appendChild(description); card.append(content); root.replaceChildren(card);
      const first = images.querySelector("img");
      if (first) updateGalleryImage(images.firstElementChild, first);
    } catch (error) {
      root.textContent = "This product could not be loaded. Please try again later.";
      console.error(error);
    }
  }
  document.addEventListener("DOMContentLoaded", loadProductDetail);
})();
</script>

</body>
</html>

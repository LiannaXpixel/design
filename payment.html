<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
  <title>ShopLiannaX - Secure Checkout</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f1115;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .checkout-card {
      background: #181b21;
      border: 1px solid #2a2f3a;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .brand { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: #94a3b8; margin-bottom: 8px; }
    .product-title { font-size: 22px; font-weight: 700; margin: 0 0 6px 0; color: #ffffff; }
    .product-meta { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
    .price-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111318;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 24px;
      border: 1px solid #252932;
    }
    .price-label { font-size: 14px; color: #cbd5e1; }
    .price-value { font-size: 22px; font-weight: 700; color: #38bdf8; }
    .stripe-wrapper { background: #ffffff; padding: 16px; border-radius: 10px; }
    #submit-btn {
      width: 100%;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }
    #submit-btn:hover { background: #7dd3fc; }
    #submit-btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin: 22px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #2a2f3a; }
    .divider:not(:empty)::before { margin-right: 12px; }
    .divider:not(:empty)::after { margin-left: 12px; }
    #error-message { color: #f87171; font-size: 14px; margin-top: 12px; text-align: center; }
    #download-section {
      display: none;
      text-align: center;
      background: #064e3b;
      border: 1px solid #10b981;
      padding: 24px;
      border-radius: 12px;
    }
    .download-btn {
      display: inline-block;
      background: #10b981;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      margin-top: 14px;
    }
    .download-btn:hover { background: #059669; }
  </style>
</head>
<body>

<div class="checkout-card">
  <div class="brand">ShopLiannaX</div>
  <h1 class="product-title">Solene Lelutka EvoX Skin PSD</h1>
  <div class="product-meta">Instant Digital Download • High-Resolution PSD</div>

  <div class="price-box">
    <span class="price-label">Total to pay</span>
    <span class="price-value">25.00 EUR</span>
  </div>

  <div id="payment-area">
    <form id="stripe-form">
      <div class="stripe-wrapper">
        <div id="payment-element"></div>
      </div>
      <button id="submit-btn" type="submit">Pay 25.00 EUR with Card / Wallet</button>
    </form>

    <div class="divider">or pay instantly with</div>

    <div id="paypal-button-container"></div>
    <div id="error-message"></div>
  </div>

  <div id="download-section">
    <h2 style="margin: 0 0 8px 0; color: #a7f3d0;">Payment Confirmed!</h2>
    <p style="font-size: 14px; color: #d1fae5; margin: 0;">
      Your private download link is ready. For security, this link expires in 60 minutes.
    </p>
    <a id="secure-link" href="#" class="download-btn">Download PSD File (13.9 MB)</a>
  </div>
</div>

<script>
  const STRIPE_PUBLIC_KEY = "pk_test_imxOQ7iOJlaX8YpyNhQ7PRBN00niQEaN8h";
  const PAYPAL_CLIENT_ID = "BAANbOcW1sazxoyVk237vyG5IYlax2ajHk2ref9oPsyB6bqbI_kalRo5QFmG9DG1N07dl7EGxp2Nm-EnaA";

 const WORKER_URL = "https://" + "plata-shopliannax.slleek-estetique.workers.dev";

  let stripe, elements;

  function showSecureDownload(downloadUrl) {
    document.getElementById("payment-area").style.display = "none";
    document.getElementById("secure-link").href = downloadUrl;
    document.getElementById("download-section").style.display = "block";
  }

  const sScript = document.createElement("script");
  sScript.src = "https://js." + "://stripe.com";
  sScript.onload = async () => {
    stripe = Stripe(STRIPE_PUBLIC_KEY);
    try {
      const res = await fetch(`${WORKER_URL}/create-stripe-intent`, { method: "POST" });
      const { clientSecret } = await res.json();
      elements = stripe.elements({ clientSecret });
      const paymentElement = elements.create("payment");
      paymentElement.mount("#payment-element");
    } catch (err) {
      document.getElementById("error-message").textContent = "Eroare la încărcarea Stripe.";
    }
  };
  document.head.appendChild(sScript);

  document.getElementById("stripe-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "Processing payment...";
    document.getElementById("error-message").textContent = "";

    const { error, paymentIntent } = await stripe.confirmPayment({
      elements,
      redirect: "if_required",
    });

    if (error) {
      document.getElementById("error-message").textContent = error.message;
      btn.disabled = false;
      btn.textContent = "Pay 25.00 EUR with Card / Wallet";
    } else if (paymentIntent && paymentIntent.status === "succeeded") {
      const verifyRes = await fetch(`${WORKER_URL}/verify-stripe`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paymentIntentId: paymentIntent.id }),
      });
      const data = await verifyRes.json();
      if (data.downloadUrl) {
        showSecureDownload(data.downloadUrl);
      } else {
        document.getElementById("error-message").textContent = "Eroare la generarea link-ului.";
      }
    }
  });

  const ppScript = document.createElement("script");
  ppScript.src = "https://www." + "://paypal.com" + PAYPAL_CLIENT_ID + "&currency=EUR";
  ppScript.onload = () => {
    paypal.Buttons({
      style: { layout: 'vertical', color: 'gold', shape: 'rect', label: 'paypal' },
      createOrder: function(data, actions) {
        return actions.order.create({
          purchase_units: [{
            description: "Solene Lelutka EvoX Skin PSD",
            amount: { currency_code: "EUR", value: "25.00" }
          }]
        });
      },
      onApprove: function(data, actions) {
        return actions.order.capture().then(async function(details) {
          const verifyRes = await fetch(`${WORKER_URL}/verify-paypal`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ orderID: data.orderID }),
          });
          const resData = await verifyRes.json();
          if (resData.downloadUrl) {
            showSecureDownload(resData.downloadUrl);
          } else {
            document.getElementById("error-message").textContent = "Eroare la verificarea plății PayPal.";
          }
        });
      },
      onError: function(err) {
        document.getElementById("error-message").textContent = "Plata PayPal a fost anulată sau a eșuat.";
      }
    }).render('#paypal-button-container');
  };
  document.head.appendChild(ppScript);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Your Grid</title>
<style>
:root{
  --accent:#ff0077;
  --accent2:#ff3399;
  --bg:#0b0b0b;
  --card:#151515;
  --border:#252525;
  --muted:#9e9e9e;
  --text:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:28px;
}
.page{width:min(980px,100%)}
.hero{
  position:relative;
  overflow:hidden;
  border-radius:28px;
  min-height:300px;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,0,119,.35),transparent 35%),
    radial-gradient(circle at 80% 70%,rgba(255,51,153,.20),transparent 35%),
    linear-gradient(135deg,#171717,#090909);
  border:1px solid var(--border);
  display:flex;
  align-items:flex-end;
  padding:42px;
}
.hero:after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.75));
}
.hero-content{position:relative;z-index:1}
.kicker{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#ddd;margin-bottom:14px}
h1{font-size:clamp(42px,7vw,76px);font-weight:500;line-height:1}
.subtitle{margin-top:16px;max-width:680px;color:#d0d0d0;font-size:18px;line-height:1.7}
.box{
  margin-top:24px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:28px;
  padding:34px;
}
.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
a{
  text-decoration:none;
  text-align:center;
  padding:18px 14px;
  border-radius:16px;
  font-weight:bold;
  color:white;
  background:#171717;
  border:1px solid #303030;
  transition:.2s;
}
a:hover{background:#202020;border-color:#555;transform:translateY(-2px)}
a.primary{
  background:var(--accent);
  border-color:var(--accent);
}
a.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.footer{
  text-align:center;
  color:#777;
  font-size:13px;
  padding:24px 10px 4px;
}
@media(max-width:650px){
  body{padding:15px}
  .hero{min-height:270px;padding:28px}
  .box{padding:22px}
  .actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="page">
  <section class="hero">
    <div class="hero-content">
      <div class="kicker">Virtual World</div>
      <h1>Your Grid</h1>
      <p class="subtitle">Welcome to our virtual world. Explore, create and meet new people.</p>
    </div>
  </section>

  <section class="box">
    <div class="actions">
      <!-- Replace these three URLs with the DreamGrid/Wifi URLs after the VPS is installed. -->
      <a class="primary" href="#">LOGIN</a>
      <a href="#">CREATE ACCOUNT</a>
      <a href="#">FORGOT PASSWORD</a>
    </div>
  </section>

  <div class="footer">Powered by OpenSimulator &amp; DreamGrid</div>
</main>
</body>
</html>

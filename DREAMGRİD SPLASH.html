<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Your Grid</title>

<style>
:root{
  --accent:#651f42;
  --accent2:#7d2854;
  --bg:#0b0b0b;
  --card:#151515;
  --border:#252525;
  --muted:#9e9e9e;
  --text:#fff;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:28px;
}

.page{width:min(980px,100%)}

.hero{
  position:relative;
  overflow:hidden;
  border-radius:28px;
  min-height:300px;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,0,119,.35),transparent 35%),
    radial-gradient(circle at 80% 70%,rgba(255,51,153,.20),transparent 35%),
    linear-gradient(135deg,#171717,#090909);
  border:1px solid var(--border);
  display:flex;
  align-items:flex-end;
  padding:42px;
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.75));
}

.hero-content{
  position:relative;
  z-index:1
}

.kicker{
  font-size:13px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#ddd;
  margin-bottom:14px
}

h1{
  font-size:clamp(42px,7vw,76px);
  font-weight:500;
  line-height:1
}

.subtitle{
  margin-top:16px;
  max-width:680px;
  color:#d0d0d0;
  font-size:18px;
  line-height:1.7
}

.box{
  margin-top:24px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:28px;
  padding:34px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

a{
  text-decoration:none;
  text-align:center;
  padding:18px 14px;
  border-radius:16px;
  font-weight:bold;
  color:white;
  background:#651f42;
  border:1px solid #76264d;
  transition:.2s;
}

a:hover{
  background:#7d2854;
  border-color:#91305f;
  transform:translateY(-2px)
}

a.primary{
  background:#651f42;
  border-color:#76264d;
}

a.primary:hover{
  background:#7d2854;
  border-color:#91305f;
}


/* CONTACT FORM */

.contact-box{
  margin-top:24px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:28px;
  padding:34px;
}

.contact-title{
  text-align:center;
  font-size:24px;
  font-weight:500;
  margin-bottom:24px;
}

.contact-form{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.contact-form input,
.contact-form textarea{
  width:100%;
  background:#0f0f0f;
  border:1px solid #2a2a2a;
  border-radius:16px;
  padding:18px;
  color:white;
  font-size:16px;
  transition:.3s;
}

.contact-form input:focus,
.contact-form textarea:focus{
  outline:none;
  border-color:#76264d;
  box-shadow:0 0 15px rgba(101,31,66,.15);
}

.contact-form textarea{
  min-height:180px;
  resize:vertical;
}

.contact-form button{
  background:#651f42;
  color:white;
  border:1px solid #76264d;
  border-radius:16px;
  padding:18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

.contact-form button:hover{
  background:#7d2854;
  border-color:#91305f;
  transform:translateY(-2px);
}

.footer{
  text-align:center;
  color:#777;
  font-size:13px;
  padding:24px 10px 4px;
}

@media(max-width:650px){

  body{
    padding:15px;
  }

  .hero{
    min-height:270px;
    padding:28px;
  }

  .box,
  .contact-box{
    padding:22px;
  }

  .actions{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<main class="page">

  <section class="hero">

    <div class="hero-content">

      <div class="kicker">Virtual World</div>

      <h1>Your Grid</h1>

      <p class="subtitle">
        Welcome to our virtual world. Explore, create and meet new people.
      </p>

    </div>

  </section>


  <!-- GRID BUTTONS -->

  <section class="box">

    <div class="actions">

      <!-- Replace these three URLs with the DreamGrid/Wifi URLs after the VPS is installed. -->

      <a class="primary" href="#">LOGIN</a>

      <a href="#">CREATE ACCOUNT</a>

      <a href="#">FORGOT PASSWORD</a>

    </div>

  </section>


  <!-- CONTACT FORM -->

  <section class="contact-box">

    <div class="contact-title">
      Contact Us
    </div>

    <form
      class="contact-form"
      action="https://api.staticforms.xyz/submit"
      method="POST"
    >

      <input
        type="hidden"
        name="accessKey"
        value="sf_73e47a82e9cb2b7ee36a9196"
      >

      <input
        type="text"
        name="honeypot"
        style="display:none"
      >

      <input
        type="text"
        name="name"
        placeholder="Your Name"
        required
      >

      <input
        type="email"
        name="email"
        placeholder="Your Email"
        required
      >

      <textarea
        name="message"
        placeholder="Write your message here..."
        required
      ></textarea>

      <input
        type="hidden"
        name="replyTo"
        value="@"
      >

      <input
        type="hidden"
        name="redirectTo"
        value="https://shopliannax.com/success.html"
      >

      <button type="submit">
        Send Message
      </button>

    </form>

  </section>


  <div class="footer">
    Powered by LiannaX &amp; Grid
  </div>

</main>

</body>
</html>
